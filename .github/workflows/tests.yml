name: Tests

on:
  push:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit

  fastmail-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - run: nix develop -c cargo test --features rustls-ring --test fastmail -- --ignored
        env:
          RUST_LOG: trace
          FASTMAIL_EMAIL: ${{ secrets.FASTMAIL_EMAIL }}
          FASTMAIL_APP_PASSWORD: ${{ secrets.FASTMAIL_APP_PASSWORD }}

  gmail-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - run: nix develop -c cargo test --features rustls-ring --test gmail gmail -- --ignored
        env:
          RUST_LOG: trace
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # NOTE: debug, not trace: debug builds log the SASL initial
      # response, which holds the minted token GitHub cannot mask.
      - run: nix develop -c cargo test --features rustls-ring --test gmail oauth -- --ignored
        env:
          RUST_LOG: debug
          IMAP_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.IMAP_GOOGLE_SERVICE_ACCOUNT_KEY }}

  stalwart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - run: ./tests/stalwart.sh
      - run: nix develop -c cargo test --features rustls-ring --test stalwart -- --ignored
        env:
          RUST_LOG: trace
