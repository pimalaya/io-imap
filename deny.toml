[advisories]
ignore = [
  # Marvin: RSA key recovery through timing sidechannels, with no
  # patched version, so it cannot be resolved by upgrading.
  #
  # rsa reaches this crate only as a dev dependency, through io-oauth's
  # jwt-bearer feature, and only to sign the assertion the live tests
  # trade for an access token. It signs locally with a throwaway
  # service account key and never decrypts, so there is no
  # network-observable oracle to time. Nothing the library ships
  # depends on it.
  { id = "RUSTSEC-2023-0071", reason = "dev-only JWT signing, no decryption oracle exposed" },
]

[sources]
allow-org.github = ["pimalaya"]
unknown-git = "deny"
unknown-registry = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
